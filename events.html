
<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Събития | TOWER BG</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b1020;
            color: #fff;
        }

        header {
            padding: 20px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #273149;
        }

        .logo {
            font-size: 23px;
            font-weight: bold;
            color: #65a9ff;
        }

        a {
            color: #8bbcff;
            text-decoration: none;
        }

        .hero {
            text-align: center;
            padding: 65px 20px 35px;
        }

        .hero h1 {
            font-size: 42px;
            margin: 10px 0;
        }

        .hero p {
            color: #aab6cc;
        }

        main {
            width: 90%;
            max-width: 1100px;
            margin: 0 auto 70px;
        }

        #events {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 22px;
        }

        .event-card {
            background: #151e32;
            border: 1px solid #2b3954;
            border-radius: 16px;
            overflow: hidden;
        }

        .event-content {
            padding: 22px;
        }

        .event-card h2 {
            margin-top: 0;
        }

        .event-description {
            color: #c0cbe0;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .event-info {
            color: #9eacc5;
            line-height: 1.8;
            font-size: 14px;
        }

        .status {
            display: inline-block;
            padding: 8px 13px;
            border-radius: 7px;
            background: #4a3515;
            color: #ffd27b;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .status.live {
            background: #4c1420;
            color: #ff7285;
        }

        .event-media {
            width: 100%;
            max-height: 350px;
            object-fit: cover;
            display: block;
        }

        video.event-media {
            background: #000;
        }

        .notify-button {
            width: 100%;
            border: 0;
            border-radius: 8px;
            padding: 13px;
            margin-top: 15px;
            background: #347de0;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .notify-button:hover {
            background: #2364bd;
        }

        .notify-button.enabled {
            background: #26734d;
        }

        #message {
            text-align: center;
            color: #aab6cc;
            padding: 35px 10px;
        }

        footer {
            text-align: center;
            color: #8190aa;
            border-top: 1px solid #273149;
            padding: 25px;
        }
    </style>
</head>

<body>

<header>
    <div class="logo">TOWER BG</div>
    <a href="index.html">← Начало</a>
</header>

<section class="hero">
    <p>АКТУАЛНИ СЪБИТИЯ</p>
    <h1>Събития</h1>
    <p>Открий какво предстои в TOWER BG!</p>
</section>

<main>
    <div id="message">Зареждане на събитията...</div>
    <div id="events"></div>
</main>

<footer>
    © TOWER BG — Всички права запазени.
</footer>

<script>
const eventsContainer = document.getElementById("events");
const message = document.getElementById("message");

const notificationStorageKey = "tower_bg_event_notifications";

function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
    })[char]);
}

function formatDate(value) {
    return new Date(value).toLocaleString("bg-BG", {
        timeZone: "Europe/Sofia",
        day: "2-digit",
        month: "2-digit",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
    });
}

function getSubscriptions() {
    try {
        return JSON.parse(
            localStorage.getItem(notificationStorageKey) || "{}"
        );
    } catch {
        return {};
    }
}

function saveSubscriptions(data) {
    localStorage.setItem(
        notificationStorageKey,
        JSON.stringify(data)
    );
}

function eventKey(event) {
    return String(event.id) + "|" + event.start_at;
}

function getStatus(event) {
    const now = Date.now();
    const start = new Date(event.start_at).getTime();
    const end = new Date(event.end_at).getTime();

    if (!Number.isFinite(start) || !Number.isFinite(end) || end <= now) {
        return null;
    }

    if (now >= start) {
        return "live";
    }

    return "upcoming";
}

function mediaHTML(event) {
    if (!event.media_url) return "";

    const url = escapeHTML(event.media_url);
    const type = event.media_type || "";

    if (type.startsWith("image/")) {
        return `<img class="event-media" src="${url}" alt="Снимка на събитието">`;
    }

    if (type.startsWith("video/")) {
        return `<video class="event-media" src="${url}" controls></video>`;
    }

    if (type === "application/pdf") {
        return `<div class="event-content"><a href="${url}" target="_blank" rel="noopener">📄 Отвори прикачения PDF файл</a></div>`;
    }

    return "";
}

function renderEvents(events) {
    const now = Date.now();
    const subscriptions = getSubscriptions();

    const visibleEvents = events
        .filter(event => {
            const start = new Date(event.start_at).getTime();
            const end = new Date(event.end_at).getTime();

            return Number.isFinite(start) &&
                   Number.isFinite(end) &&
                   end > now;
        })
        .sort((a, b) =>
            new Date(a.start_at) - new Date(b.start_at)
        );

    if (!visibleEvents.length) {
        eventsContainer.innerHTML = "";
        message.textContent = "В момента няма предстоящи събития.";
        message.style.display = "block";
        return;
    }

    message.style.display = "none";

    eventsContainer.innerHTML = visibleEvents.map(event => {
        const status = getStatus(event);
        const key = eventKey(event);
        const subscribed = Boolean(subscriptions[key]);

        const statusHTML = status === "live"
            ? '<div class="status live">● LIVE NOW</div>'
            : '<div class="status">ОЧАКВАЙТЕ СКОРО</div>';

        return `
            <article class="event-card">
                ${mediaHTML(event)}

                <div class="event-content">
                    ${statusHTML}

                    <h2>${escapeHTML(event.title)}</h2>

                    <div class="event-description">
                        ${escapeHTML(event.description)}
                    </div>

                    <div class="event-info">
                        📍 ${escapeHTML(event.location)}<br>
                        🕒 Начало: ${formatDate(event.start_at)}<br>
                        🕒 Край: ${formatDate(event.end_at)}
                    </div>

                    <button
                        class="notify-button ${subscribed ? "enabled" : ""}"
                        data-event-id="${Number(event.id)}"
                        data-event-start="${escapeHTML(event.start_at)}"
                    >
                        ${subscribed ? "✓ ИЗВЕСТИЯТА СА ВКЛЮЧЕНИ" : "🔔 ИЗВЕСТИ МЕ"}
                    </button>
                </div>
            </article>
        `;
    }).join("");

    eventsContainer.querySelectorAll(".notify-button").forEach(button => {
        button.addEventListener("click", () => {
            enableNotification(button);
        });
    });
}

async function loadEvents() {
    try {
        const response = await fetch("/api/events", {
            cache: "no-store"
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(data.error || "Грешка при зареждане.");
        }

        renderEvents(data.events || []);
        checkNotifications();

    } catch (error) {
        message.style.display = "block";
        message.textContent =
            "Не успяхме да заредим събитията. " + error.message;
    }
}

async function enableNotification(button) {
    if (!("Notification" in window)) {
        alert("Този браузър не поддържа известия.");
        return;
    }

    const permission = await Notification.requestPermission();

    if (permission !== "granted") {
        alert("Разреши известията от настройките на браузъра.");
        return;
    }

    const eventId = button.dataset.eventId;
    const startAt = button.dataset.eventStart;

    const event = window.currentEvents?.find(item =>
        String(item.id) === eventId &&
        item.start_at === startAt
    );

    const subscriptions = getSubscriptions();
    const key = eventId + "|" + startAt;

    subscriptions[key] = {
        title: event?.title || "TOWER BG събитие",
        location: event?.location || "",
        start_at: startAt,
        end_at: event?.end_at,
        sent: false
    };

    saveSubscriptions(subscriptions);

    button.textContent = "✓ ИЗВЕСТИЯТА СА ВКЛЮЧЕНИ";
    button.classList.add("enabled");

    checkNotifications();
}

function checkNotifications() {
    if (
        !("Notification" in window) ||
        Notification.permission !== "granted"
    ) {
        return;
    }

    const subscriptions = getSubscriptions();
    const now = Date.now();
    let changed = false;

    for (const [key, item] of Object.entries(subscriptions)) {
        const start = new Date(item.start_at).getTime();
        const end = new Date(item.end_at).getTime();

        if (
            !item.sent &&
            Number.isFinite(start) &&
            Number.isFinite(end) &&
            now >= start &&
            now < end
        ) {
            new Notification("TOWER BG — LIVE NOW", {
                body: item.title + " започна! " + item.location
            });

            item.sent = true;
            changed = true;
        }
    }

    if (changed) {
        saveSubscriptions(subscriptions);
    }
}

window.currentEvents = [];

const originalRenderEvents = renderEvents;

renderEvents = function(events) {
    window.currentEvents = events;
    originalRenderEvents(events);
};

loadEvents();

setInterval(loadEvents, 20000);
setInterval(checkNotifications, 10000);

</script>

</body>
</html>
